name: pbg_app
description: A new Flutter application.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  fluttertoast: ^9.0.0
  dio: ^5.2.1+1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  geolocator: ^14.0.2
  http: ^1.2.1
  device_info_plus: ^12.2.0
  shared_preferences: ^2.1.2
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  intl: ^0.20.2
  file_picker: ^10.3.6
  flutter_launcher_icons: ^0.14.3
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  image_picker: ^1.0.4
  flutter_spinkit: ^5.2.0
  dotted_border: ^3.1.0
  dropdown_search: ^5.0.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  firebase_crashlytics: ^5.0.5
  firebase_core: ^4.2.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter_icons:
  android: "hp_oil_logo"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/hp_oil_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/

