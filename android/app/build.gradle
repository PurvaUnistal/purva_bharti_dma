plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def keystoreProperties = new Properties()



android {
    namespace "com"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    flavorDimensions "app"
    productFlavors {
        prodPBGPL {
            dimension "app"
            applicationIdSuffix ".unistal.pbg_app"
            resValue "string", "app_name", "PBGPL DMA"
            manifestPlaceholders = [
                    appIcon: "@mipmap/pbg_logo",
                    appIconRound: "@mipmap/pbg_logo"
            ]
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 1
            versionName "1.0.0-PBGPL DMA"
        }
        prodMGL {
            dimension "app"
            applicationIdSuffix ".unistal.mgl.dma"
            resValue "string", "app_name", "MGL DMA"
            manifestPlaceholders = [
                    appIcon: "@mipmap/mgl_logo",
                    appIconRound: "@mipmap/mgl_logo"
            ]
            def keystorePropertiesFile = rootProject.file('mgl_key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 1
            versionName "1.0.0-MGL DMA"
        }
        prodHPOIL {
            dimension "app"
            applicationIdSuffix ".unistal.hpoil.dma"
            resValue "string", "app_name", "HPOIL DMA"
            manifestPlaceholders = [
                    appIcon: "@mipmap/hp_oil_logo",
                    appIconRound: "@mipmap/hp_oil_logo"
            ]
            def keystorePropertiesFile = rootProject.file('hpoil.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            versionCode 2
            versionName "1.0.0-HPOIL DMA"
        }
        prodVPPL {
            dimension "app"
            applicationIdSuffix ".unistal.vppl.dma"
            resValue "string", "app_name", "VPPL DMA"
            manifestPlaceholders = [
                    appIcon: "@mipmap/mgl_logo",
                    appIconRound: "@mipmap/mgl_logo"
            ]
            versionCode 1
            versionName "1.0.0-VPPL DMA"
        }
        prodVRPL {
            dimension "app"
            applicationIdSuffix ".unistal.vrpl.dma"
            resValue "string", "app_name", "VRPL DMA"
            manifestPlaceholders = [
                    appIcon: "@mipmap/mgl_logo",
                    appIconRound: "@mipmap/mgl_logo"
            ]
            versionCode 1
            versionName "1.0.0-VRPL DMA"
        }
        prodHNGPL {
            dimension "app"
            applicationIdSuffix ".unistal.hngpl.dma"
            resValue "string", "app_name", "HNGPL DMA"
            manifestPlaceholders = [
                    appIcon: "@mipmap/hngpl_logo",
                    appIconRound: "@mipmap/hngpl_logo"
            ]
            versionCode 1
            versionName "1.0.0-VRPL DMA"
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }


    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'META-INF/proguard/androidx-annotations.pro'
        exclude 'META-INF/proguard/coroutines.pro'
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")
    implementation(platform("com.google.firebase:firebase-bom:33.12.0"))
}
